[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fibermind"
version = "0.4.0.dev0"
description = "A representation layer for distributed acoustic sensing that transfers across interrogators, sites and conditions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FiberMind.AI Private Limited", email = "deep@fibermind.ai" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.2",
    "lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "h5py>=3.10",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["fibermind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/history"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
